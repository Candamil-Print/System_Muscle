<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>

    <!--
      Aplica el tema oscuro/claro ANTES de que se pinte el body,
      leyendo localStorage de forma síncrona. Esto evita el segundo
      "flash" (claro -> oscuro) que antes ocurría en onMount.
      También fija un color de fondo acorde, para que si queda algún
      resquicio de tiempo antes de que cargue el CSS, no se vea blanco.
    -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f172a';
          } else {
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch (e) {
          document.documentElement.style.backgroundColor = '#f8fafc';
        }
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
